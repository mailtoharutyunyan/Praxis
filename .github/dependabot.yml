version: 2

# Weekly version updates. Each new release must be 14 days old before Dependabot proposes it, which keeps
# freshly published (and possibly compromised) versions out; security updates are not delayed. Major versions
# (Java 26, Node 26, TypeScript 7, ...) are upgraded on purpose, not by a bot; minor and patch updates come grouped,
# one pull request per ecosystem.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      maven:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']
