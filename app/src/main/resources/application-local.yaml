# Local development: placeholder stages, developer JWT key (run scripts/dev-token.sh once to create it).
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:../.dev/jwt-public.pem

agentic:
  stub-stages:
    enabled: true
  # Real model stages need an API key; without one the placeholders walk runs through the pipeline.
  agent:
    enabled: ${AGENTIC_AGENTS:false}
  ui:
    auth-mode: dev
  security:
    cors-allowed-origins:
      - http://localhost:5173

logging:
  level:
    io.agenticsdlc: DEBUG
