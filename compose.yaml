# Everything in one command: the app with its web UI, Postgres, the sandbox egress proxy and Docker access.
#
#   docker compose up -d --build
#
# Then open http://localhost:8080. The first visit creates the admin account and walks through setup: a code host
# and a model are required; Jira, Slack and pull request feedback can be skipped and added later in Settings.
# Secrets entered there are encrypted in Postgres with a key kept in the `agentic-data` volume (or AGENTIC_SECRETS_KEY).
#
# Optional settings (environment or a .env file next to this one):
#   AGENTIC_PORT          host port of the UI and API (default 8080)
#   POSTGRES_PASSWORD     database password (set it before the first start)
#   AGENTIC_SECRETS_KEY   base64 of 32 random bytes (`openssl rand -base64 32`); back it up with the database
#   AGENTIC_SANDBOX_RUNTIME  container runtime for sandboxes, e.g. runsc (gVisor) once installed on the Docker host
#   BACKUP_KEEP_DAYS      how many days of nightly database dumps to keep (default 14)
#
# The first-run setup code is in the app log:  docker compose logs app | grep "setup code"
#
# For local development of the app itself, use dev/postgres/compose.yaml (started by `./mvnw -pl app spring-boot:run`).
name: agentic-sdlc

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_sdlc
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentic -d agentic_sdlc']
      interval: 5s
      timeout: 3s
      retries: 20

  # Sandboxes join the internal network `agentic-sandbox`, which has no route out. This allowlisting proxy is the only
  # way out: package registries and api.osv.dev (dev/egress/allowed-domains.txt), nothing else.
  egress:
    image: ubuntu/squid:6.6-24.04_edge
    restart: unless-stopped
    volumes:
      - ./dev/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./dev/egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks:
      sandbox:
        aliases: [egress]
      default: {}

  # The app starts sandbox containers through this proxy rather than holding the Docker socket itself. Docker access
  # is still powerful: run this stack on a machine dedicated to it, or on rootless Docker.
  docker:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      INFO: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  app:
    build: .
    image: agentic-sdlc:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docker:
        condition: service_started
      egress:
        condition: service_started
    ports:
      - '${AGENTIC_PORT:-8080}:8080'
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/agentic_sdlc
      SPRING_R2DBC_USERNAME: agentic
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-agentic-change-me}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/agentic_sdlc
      SPRING_FLYWAY_USER: agentic
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-agentic-change-me}
      # Built-in sign-in instead of an OIDC provider; connectors are configured in the UI (ADR-0007).
      AGENTIC_SECURITY_MODE: local
      AGENTIC_SECRETS_KEY: ${AGENTIC_SECRETS_KEY:-}
      AGENTIC_DATA_DIR: /var/lib/agentic/data
      # A single admin approves their own runs; set to true once several people use the install.
      AGENTIC_GATES_FORBIDSELFAPPROVAL: 'false'
      AGENTIC_SANDBOX_DOCKERHOST: tcp://docker:2375
      AGENTIC_SANDBOX_NETWORK: agentic-sandbox
      AGENTIC_SANDBOX_EGRESSPROXY: http://egress:3128
      # Sandboxes mount each run's directory from this volume, which the app sees at the workspace root.
      AGENTIC_SANDBOX_WORKSPACEVOLUME: agentic-workspaces
      AGENTIC_SANDBOX_RUNTIME: ${AGENTIC_SANDBOX_RUNTIME:-}
      # Claude Code for the "claude-code" agent engine (ADR-0008), put there by cli-installer; sandboxes mount it read-only.
      AGENTIC_AGENT_CLI_TOOLSVOLUME: agentic-tools
    volumes:
      - agentic-workspaces:/var/lib/agentic/workspaces
      - agentic-data:/var/lib/agentic/data
    healthcheck:
      # Readiness from the internal management port, without curl in the image.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && grep -q "UP" <&3']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    extra_hosts:
      # Reach a model server on this machine, e.g. Ollama at http://host.docker.internal:11434
      - host.docker.internal:host-gateway
    networks:
      - default
      - docker-api

  # Nightly database dumps (pg_dump custom format) in the agentic-backups volume, the oldest pruned after
  # BACKUP_KEEP_DAYS. Copy them out:  docker compose cp backup:/backups ./backups
  # Restore:  docker compose exec -T postgres pg_restore -U agentic -d agentic_sdlc --clean < backups/<file>.dump
  # Back up the agentic-data volume (or AGENTIC_SECRETS_KEY) too: stored secrets cannot be read without that key.
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: agentic
      PGDATABASE: agentic_sdlc
      PGPASSWORD: ${POSTGRES_PASSWORD:-agentic-change-me}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ['sh', '-c']
    command:
      - |
        while true; do
          file=/backups/agentic-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -Fc -f "$$file.partial"; then mv "$$file.partial" "$$file"; echo "backup written: $$file";
          else rm -f "$$file.partial"; echo "backup failed" >&2; fi
          find /backups -name 'agentic-*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    volumes:
      - agentic-backups:/backups

  # Optional: Claude Code for the "claude-code" agent engine (Settings, AI model; ADR-0008). Downloads the pinned native
  # build, checks it against the SHA-256 in the release manifest, puts it in the agentic-tools volume, which every sandbox
  # mounts read-only at /opt/agentic-tools, and exits. Run it once, and again after changing the version:
  #   docker compose --profile claude-code up cli-installer
  # The build is for glibc. If your toolchain images are Alpine (musl), set CLAUDE_CODE_PLATFORM=linux-x64-musl (or
  # linux-arm64-musl); one build serves every sandbox, so the images have to agree.
  cli-installer:
    image: alpine:3.24.2
    profiles: [claude-code]
    restart: 'no'
    environment:
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.282}
      CLAUDE_CODE_PLATFORM: ${CLAUDE_CODE_PLATFORM:-}
    entrypoint: ['sh', '-euc']
    command:
      - |
        platform="$${CLAUDE_CODE_PLATFORM:-}"
        if [ -z "$$platform" ]; then
          case "$$(uname -m)" in
            x86_64|amd64) platform=linux-x64 ;;
            aarch64|arm64) platform=linux-arm64 ;;
            *) echo "unsupported architecture $$(uname -m)" >&2; exit 1 ;;
          esac
        fi
        if [ "$$(cat /tools/VERSION 2>/dev/null)" = "$$CLAUDE_CODE_VERSION $$platform" ]; then
          echo "Claude Code $$CLAUDE_CODE_VERSION ($$platform) is installed"; exit 0
        fi
        apk add --no-cache curl jq >/dev/null
        release=https://downloads.claude.ai/claude-code-releases/$$CLAUDE_CODE_VERSION
        checksum=$$(curl -fsSL "$$release/manifest.json" | jq -er --arg p "$$platform" '.platforms[$$p].checksum')
        curl -fsSL -o /tmp/claude "$$release/$$platform/claude"
        echo "$$checksum  /tmp/claude" | sha256sum -c -
        install -m 0755 /tmp/claude /tools/claude.new && mv /tools/claude.new /tools/claude
        echo "$$CLAUDE_CODE_VERSION $$platform" > /tools/VERSION
        echo "installed Claude Code $$CLAUDE_CODE_VERSION ($$platform)"
    volumes:
      - agentic-tools:/tools

volumes:
  postgres-data: {}
  agentic-backups: {}
  agentic-data: {}
  # Named explicitly: the app refers to it by name when it starts sandboxes.
  agentic-workspaces:
    name: agentic-workspaces
  # Named explicitly too: sandboxes mount it by name (agentic.agent.cli.tools-volume).
  agentic-tools:
    name: agentic-tools

networks:
  default: {}
  sandbox:
    name: agentic-sandbox
    internal: true
  docker-api:
    internal: true
