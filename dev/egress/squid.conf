# Forward proxy that only reaches allowlisted registries. -n: match names only, never reverse-resolve IP literals.
http_port 3128
acl allowed dstdomain -n "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
# No caching, no identifying headers.
cache deny all
via off
forwarded_for delete
