# Local development database. Spring Boot's Docker Compose support starts it automatically
# when the app runs from the IDE or `./mvnw -pl app spring-boot:run`.
name: agentic-sdlc-dev
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=agentic_sdlc'
      - 'POSTGRES_USER=agentic'
      - 'POSTGRES_PASSWORD=agentic-dev-only'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentic -d agentic_sdlc']
      interval: 5s
      timeout: 3s
      retries: 10
